  <circle cx="560" cy="512" r="80" stroke="#18C8F0" stroke-width="10" fill="none"/>
  <line x1="560" y1="374" x2="560" y2="432" stroke="#18C8F0" stroke-width="18" stroke-linecap="round"/>
  <line x1="560" y1="592" x2="560" y2="650" stroke="#18C8F0" stroke-width="18" stroke-linecap="round"/>
  <line x1="422" y1="512" x2="480" y2="512" stroke="#18C8F0" stroke-width="18" stroke-linecap="round"/>
  <line x1="640" y1="512" x2="698" y2="512" stroke="#18C8F0" stroke-width="18" stroke-linecap="round"/>
</svg>
