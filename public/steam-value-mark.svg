<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="navyGrad" x1="182" y1="154" x2="768" y2="710" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B4E93"/>
      <stop offset="1" stop-color="#082F68"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="284" y1="278" x2="884" y2="850" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1ED5F0"/>
      <stop offset="1" stop-color="#12B9EE"/>
