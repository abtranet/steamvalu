<svg xmlns="http://www.w3.org/2000/svg"
     width="2400" height="800" viewBox="0 0 2400 800"
     role="img" aria-labelledby="title desc">
  <title id="title">STEAM VALUE — Digital Twin Platform</title>
  <desc id="desc">Scalable vector logo with overlapping navy and cyan hexagons, target icon, and STEAM VALUE wordmark.</desc>

  <defs>
    <linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B4E93"/>
      <stop offset="100%" stop-color="#082F68"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16CFEA"/>
      <stop offset="100%" stop-color="#12AEEA"/>
    </linearGradient>
  </defs>

  <g transform="translate(120,60)">
    <polygon points="290,0 540,145 540,435 290,580 40,435 40,145"
             fill="none" stroke="url(#navyGrad)" stroke-width="34"
             stroke-linejoin="miter"/>
    <polygon points="395,95 645,240 645,530 395,675 145,530 145,240"
             fill="none" stroke="url(#cyanGrad)" stroke-width="34"
             stroke-linejoin="miter"/>

    <circle cx="330" cy="355" r="72" fill="#123B69"/>
    <circle cx="330" cy="355" r="74" fill="none" stroke="#15BFE5" stroke-width="10"/>
    <line x1="330" y1="245" x2="330" y2="285" stroke="#15BFE5" stroke-width="16" stroke-linecap="round"/>
    <line x1="330" y1="425" x2="330" y2="465" stroke="#15BFE5" stroke-width="16" stroke-linecap="round"/>
    <line x1="220" y1="355" x2="260" y2="355" stroke="#15BFE5" stroke-width="16" stroke-linecap="round"/>
    <line x1="400" y1="355" x2="440" y2="355" stroke="#15BFE5" stroke-width="16" stroke-linecap="round"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="815" y="345"
          font-size="190" font-weight="800"
          fill="url(#navyGrad)" letter-spacing="-5">STEAM</text>

    <text x="1475" y="345"
          font-size="190" font-weight="800"
          fill="url(#cyanGrad)" letter-spacing="-5">VALUE</text>

    <text x="825" y="480"
          font-size="70" font-weight="400"
          fill="#425F78" letter-spacing="20">DIGITAL TWIN PLATFORM</text>
  </g>
</svg>